name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST = 18:29 UTC
    - cron: '29 18 * * 4'

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-progress-report
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile generate_report.py
          python -u generate_report.py weekly

          # Fail here with a clear message if the generator did not create
          # the expected original Form-3 filename in the repository root.
          shopt -s nullglob
          pdf_files=( *_Weekly_Progress_Report_Form-3_*.pdf )
          if [ ${#pdf_files[@]} -eq 0 ]; then
            echo "::error::Generator completed without creating the expected Form-3 PDF."
            echo "Current directory: $PWD"
            echo "Root files:"
            ls -lah
            exit 1
          fi
          printf 'Generated report: %s\n' "${pdf_files[@]}"

      - name: Move PDF to Weekly Reports Directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weekly_reports
          shopt -s nullglob
          pdf_files=( *_Weekly_Progress_Report_Form-3_*.pdf )

          if [ ${#pdf_files[@]} -eq 0 ]; then
            echo "::error::No Form-3 weekly PDF found in the repository root."
            exit 1
          fi

          mv -- "${pdf_files[@]}" weekly_reports/
          echo "Archived report(s):"
          ls -lh weekly_reports/

      - name: Verify Weekly Report
        shell: bash
        run: |
          set -euo pipefail
          report_count=0

          for file in weekly_reports/*_Weekly_Progress_Report_Form-3_*.pdf; do
            [ -f "$file" ] || continue
            [ -s "$file" ] || { echo "::error::Empty PDF: $file"; exit 1; }
            head -c 5 "$file" | grep -aq '%PDF-' || {
              echo "::error::Invalid PDF: $file"
              exit 1
            }
            echo "Verified: $file"
            report_count=$((report_count + 1))
          done

          if [ "$report_count" -eq 0 ]; then
            echo "::error::No valid weekly Form-3 report found."
            exit 1
          fi

      - name: Commit Weekly Report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No new changes or reports to commit."
            exit 0
          fi

          git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
          git push origin HEAD:main
