
name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST = 18:29 UTC
    - cron: '29 18 * * 4'

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-progress-report
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Move PDF to Weekly Reports Directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p weekly_reports

          echo "Looking for generated PDF files..."

          # Find PDFs outside weekly_reports, regardless of filename.
          PDF_FILE="$(
            find . -maxdepth 3 -type f -iname '*.pdf' \
              -not -path './weekly_reports/*' \
              -not -path './.git/*' \
              -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$PDF_FILE" ]; then
            echo "::error::No generated PDF found. Check generate_report.py and the preceding step."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found PDF: $PDF_FILE"

          # Preserve the original filename.
          DESTINATION="weekly_reports/$(basename "$PDF_FILE")"

          if [ "$PDF_FILE" != "$DESTINATION" ]; then
            mv "$PDF_FILE" "$DESTINATION"
          fi

          echo "Report ready: $DESTINATION"
          ls -lh weekly_reports/

      - name: Verify Weekly Report
        shell: bash
        run: |
          set -euo pipefail

          if ! find weekly_reports -maxdepth 1 -type f -iname '*.pdf' \
            -print -quit | grep -q .; then
            echo "::error::No PDF exists in weekly_reports/"
            exit 1
          fi

          echo "Weekly report verification passed."

      - name: Commit Weekly Report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No new changes or reports to commit."
            exit 0
          fi

          git commit -m "docs: archive Form-3 weekly progress report [skip ci]"

          # Retry if main changes while this workflow is running.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Weekly report committed and pushed successfully."
                exit 0
              fi
            else
              echo "::warning::Rebase failed; aborting rebase."
              git rebase --abort || true
            fi

            echo "Push attempt $attempt failed."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to push the report after 3 attempts."
          exit 1
