
name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST (18:29 UTC)
    - cron: '29 18 * * 4'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-progress-report
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          set -euo pipefail
          python generate_report.py weekly

      # The Python script already writes its PDF to weekly_reports/.
      # Do not move or search for another PDF.

      - name: Verify Generated Report
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking weekly_reports directory..."
          ls -lah weekly_reports/

          # Require at least one non-empty PDF in the output directory.
          PDF_COUNT=0

          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "::error::PDF is empty: $file"
              exit 1
            fi

            # Check that the file begins with the PDF signature.
            if ! head -c 5 "$file" | grep -aq '%PDF-'; then
              echo "::error::File is not a valid PDF: $file"
              exit 1
            fi

            echo "Verified: $file"
            PDF_COUNT=$((PDF_COUNT + 1))
          done < <(
            find weekly_reports -maxdepth 1 -type f \
              -iname '*.pdf' -print0
          )

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "::error::No PDF was generated in weekly_reports/."
            exit 1
          fi

          echo "Verified $PDF_COUNT PDF file(s)."

      - name: Commit Weekly Report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit \
            -m "docs: archive weekly progress report [skip ci]"

          # Retry if another commit reaches main before the push.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase failed. Check for conflicts."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Weekly report committed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to push the report after 3 attempts."
          exit 1
